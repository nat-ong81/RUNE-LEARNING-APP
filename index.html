<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runes">
<meta name="theme-color" content="#1a2038">
<title>Werk Your Magick · Runes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Same look as the Grimoire: stone-grey ground, navy ombré night, navy and dark-gold type. Phone-first: one column, tab bar at the thumb. */
:root{
  --bg:#d2cfc8; --paper:#dcd9d3; --ink:#1d2440; --navy:#1a2038; --slate:#3d4563; --muted:#565c74;
  --line:rgba(29,36,64,.3); --dot:rgba(29,36,64,.14);
  --gold:#8e6f33; --gold-lt:#c7a767; --lit:#f3f1ec; --warn:#8b3f45; --shade:rgba(20,24,44,.45);
  --ombre:linear-gradient(180deg,var(--navy) 0%,#262d4b 45%,var(--slate) 100%);
  --display:"Canela","Canela Deck","Cormorant Garamond",Georgia,serif;
  --body:"Minion Pro","Minion 3","Crimson Pro",Georgia,serif;
  --hair:.5px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow-x:clip}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
.lab{display:block;font:500 11px/1.3 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.sub{font-style:italic;color:var(--muted);font-size:15.5px}
.gl{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

header{position:sticky;top:0;z-index:20;background:var(--ombre);padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;text-align:center}
.brand{font:400 21px/1 var(--display);letter-spacing:.04em;color:var(--gold-lt)}
.brand span{color:var(--lit);opacity:.6}
main{max-width:560px;margin:0 auto;padding:22px 20px calc(96px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(0deg,var(--navy),#262d4b 55%,var(--slate));display:flex;justify-content:center;padding:0 8px env(safe-area-inset-bottom,0px);border-top:var(--hair) solid rgba(199,167,103,.35)}
nav button{all:unset;flex:1 1 0;max-width:120px;text-align:center;cursor:pointer;font:500 10.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:rgba(243,241,236,.7);padding:18px 0 16px;position:relative}
nav button[aria-current="true"]{color:var(--gold-lt)}
nav button[aria-current="true"]::after{content:"";position:absolute;left:28%;right:28%;top:0;height:1px;background:var(--gold-lt)}

.btn{appearance:none;background:var(--ombre);border:var(--hair) solid var(--navy);border-radius:0;color:var(--lit);font:500 11.5px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;padding:16px 12px;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.wide{display:block;width:100%;margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.three{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;margin-top:16px}
.link{all:unset;cursor:pointer;font:500 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border-bottom:var(--hair) solid var(--line);padding-bottom:2px}
.link.warn{color:var(--warn)}
.hint{text-align:center;font-style:italic;color:var(--muted);font-size:15px;margin-top:16px}
.stars{color:var(--gold-lt);display:flex;justify-content:center;gap:14px}
.stars svg{width:11px;height:11px;display:block}
.tag{font:500 9.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border:var(--hair) solid var(--gold);padding:3px 6px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.tag.on{background:var(--navy);color:var(--gold-lt);border-color:var(--navy)}
.tag.off{color:var(--muted);border-color:var(--line)}

/* ---------- Today ---------- */
.hero{text-align:center;padding:26px 20px 72px;margin:-22px calc(50% - 50vw) 0;background:linear-gradient(180deg,var(--slate) 0%,var(--slate) 38%,rgba(61,69,99,.35) 72%,rgba(61,69,99,0) 100%)}
.hero h1{font-size:clamp(30px,8vw,40px);line-height:1.1;margin-top:10px;color:var(--lit)}
.rod{position:relative;margin-top:-34px;background:var(--paper);border:1px solid var(--gold);padding:18px 20px 20px;box-shadow:0 14px 30px -24px var(--shade)}
.rodin{display:flex;gap:20px;align-items:center;margin-top:12px}
.rodin h2{font-size:34px;line-height:1.1}
.rodin p{margin-top:6px;font-size:16px}
.sec{margin-top:34px}
.modes{border-top:var(--hair) solid var(--line);margin-top:10px}
.mode{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:var(--hair) solid var(--line);cursor:pointer}
.mode h3{font-size:26px;line-height:1.15;margin-top:2px}
.mode p{font-size:15.5px;color:var(--muted)}
.mode .tag{margin:0;flex:none}
.facts{display:grid;grid-template-columns:1fr 1fr;text-align:center;margin-top:30px}
.facts b{display:block;font:400 44px/1.1 var(--display);font-variant-numeric:tabular-nums}

/* ---------- Sessions ---------- */
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bar .count{font-size:14px;font-style:italic;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:2px;background:var(--line);margin:10px 0 22px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.card{all:unset;box-sizing:border-box;width:100%;min-height:min(400px,52dvh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:26px 22px;cursor:pointer;border:var(--hair) solid var(--line);border-radius:8px;background:radial-gradient(var(--dot) .75px,transparent 1px) 0 0/20px 20px,var(--paper);box-shadow:0 18px 36px -28px var(--shade)}
.card h2{font-size:44px;line-height:1.1}
.card.back{background:var(--ombre);color:var(--lit);border-color:var(--navy)}
.card.back h2{color:var(--lit);font-size:38px}
.card.back .lab{color:var(--gold-lt);margin-top:10px}
.card.back .gl{color:var(--gold-lt)}
.card.back .sub{color:rgba(243,241,236,.72)}
.ask{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px}
.ask h2{font-size:40px;line-height:1.1}
.ask .big{font:400 25px/1.25 var(--display);max-width:22ch}
.opts{display:grid;gap:10px}
.opts.g{grid-template-columns:1fr 1fr}
.opt{all:unset;box-sizing:border-box;width:100%;min-height:54px;display:flex;align-items:center;padding:13px 16px;border:var(--hair) solid var(--line);background:var(--paper);cursor:pointer;font-size:16.5px;line-height:1.35}
.opts.g .opt{justify-content:center;padding:14px}
.opt.ok{background:var(--ombre);color:var(--gold-lt);border-color:var(--navy)}
.opt.bad{border:1px solid var(--warn);color:var(--warn)}
.fb{display:flex;gap:16px;align-items:center;margin-top:18px;border-top:var(--hair) solid var(--line);padding-top:16px}
.fb h3{font-size:25px;line-height:1.15}
.fb p{font-size:15.5px}
.fb .bad{color:var(--warn)}
.pad{position:relative;width:min(100%,300px,44dvh);aspect-ratio:1;margin:0 auto;border:var(--hair) solid var(--line);border-radius:8px;overflow:hidden;background:radial-gradient(var(--dot) .75px,transparent 1px) 0 0/20px 20px,var(--paper)}
.pad canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pad .over{position:absolute;inset:0;width:100%;height:100%;color:var(--gold);opacity:.85;stroke-width:5;pointer-events:none}
.result{text-align:center;padding:26px 0 8px;display:flex;flex-direction:column;gap:10px}
.result .n{font:400 64px/1 var(--display);font-variant-numeric:tabular-nums}

/* ---------- Rune rows ---------- */
.head h1{font-size:40px;line-height:1.1;margin-top:2px}
.rows{border-top:var(--hair) solid var(--line);margin-top:14px}
.row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:16px;align-items:center;padding:16px 0;border-bottom:var(--hair) solid var(--line)}
.row h3{font-size:25px;line-height:1.15}
.row p{font-size:15.5px}
.row .lab{margin:2px 0 4px}
.foot{text-align:center;margin-top:30px}

button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
nav button:focus-visible{outline-color:var(--gold-lt);outline-offset:-6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="brand">Werk Your Magick <span>·</span> Runes</div></header>
<main id="main"></main>
<nav id="nav" aria-label="Sections">
  <button data-v="home">Today</button>
  <button data-v="cards">Cards</button>
  <button data-v="quiz">Quiz</button>
  <button data-v="draw">Draw</button>
  <button data-v="lib">Runes</button>
</nav>

<script>
/* ================= the runes =================
   Edit this table to match your own grimoire. Each row is:
   id, name, sound, literal meaning, what it means, what it protects, shape.
   The shape is lines on a grid 60 wide by 100 tall: "x,y x,y" joins points, "|" starts a new line. */
const R=[
 ['fehu','Fehu','F','Cattle','Wealth, abundance and prosperity you have earned','Money, possessions and livelihood, against loss and theft','15,0 15,100|15,32 50,6|15,60 50,34'],
 ['uruz','Uruz','U','Aurochs','Raw strength, vitality and good health','Physical health, strength and stamina, against illness and weakness','12,100 12,0 48,34 48,100'],
 ['thurisaz','Thurisaz','Th','Thorn','Defence, reactive force and conflict','Against attack, enemies and ill will, like a hedge of thorns','20,0 20,100|20,28 50,50 20,72'],
 ['ansuz','Ansuz','A','A god, the mouth','Communication, wisdom and messages from the divine','Truthful speech and clear thinking, against lies and deception','15,0 15,100|15,0 48,26|15,28 48,54'],
 ['raidho','Raidho','R','Ride','Travel, rhythm and moving in the right direction','Travellers and journeys, keeping you on the right road','15,100 15,0 46,22 15,46 48,100'],
 ['kenaz','Kenaz','K','Torch','Knowledge, creativity and illumination','The creative spark and clear sight, against confusion and hidden harm','46,18 14,50 46,82'],
 ['gebo','Gebo','G','Gift','Gifts, generosity and balanced partnership','Partnerships, oaths and fair exchange','8,8 52,92|52,8 8,92'],
 ['wunjo','Wunjo','W','Joy','Joy, harmony and belonging','Happiness and harmony at home, against sorrow and discord','18,0 18,100|18,0 48,24 18,48'],
 ['hagalaz','Hagalaz','H','Hail','Disruption, sudden change and trials you cannot control','Against storms, upheaval and destructive outside forces','10,0 10,100|50,0 50,100|10,36 50,64'],
 ['nauthiz','Nauthiz','N','Need','Need, constraint and the resilience it builds','Against want and hardship, lending endurance in times of need','30,0 30,100|12,36 48,64'],
 ['isa','Isa','I','Ice','Stillness, pause and concentration','Boundaries and calm, halting unwanted forces in their tracks','30,0 30,100'],
 ['jera','Jera','J / Y','Year','Cycles, harvest and patience rewarded','Harvests, long-term work and the fair return on effort','36,14 12,38 36,62|24,38 48,62 24,86'],
 ['eihwaz','Eihwaz','Ei','Yew','Endurance, death and renewal','Life through endings and transitions; a strong all-round defence','30,0 30,100|30,0 50,22|30,100 10,78'],
 ['perthro','Perthro','P','Lot cup','Fate, mystery and chance','Secrets, luck and what is still unfolding','48,0 30,20 12,0 12,100 30,80 48,100'],
 ['algiz','Algiz','Z','Elk','Protection, guardianship and the higher self','The whole self, home and loved ones; the chief rune of protection','30,0 30,100|30,48 8,10|30,48 52,10'],
 ['sowilo','Sowilo','S','Sun','Success, vitality and clarity','Health, confidence and success, driving out darkness and ill will','46,4 14,36 46,64 14,96'],
 ['tiwaz','Tiwaz','T','The god Tyr','Justice, honour and courage','The just cause, in conflicts, contests and legal matters','30,0 30,100|6,30 30,0 54,30'],
 ['berkano','Berkano','B','Birch','Birth, growth and nurturing','Mothers, children, the home and new beginnings','14,0 14,100|14,0 46,25 14,50 46,75 14,100'],
 ['ehwaz','Ehwaz','E','Horse','Trust, teamwork and steady movement','Partners, animals and vehicles; safe and steady progress','10,100 10,0 30,30 50,0 50,100'],
 ['mannaz','Mannaz','M','Humankind','The self, humanity and community','Family, friends and community, against isolation','10,100 10,0 50,40|50,100 50,0 10,40'],
 ['laguz','Laguz','L','Water','Intuition, emotion and flow','Dreams, intuition and travel over water','20,0 20,100|20,0 48,30'],
 ['ingwaz','Ingwaz','Ng','The god Ing','Fertility, potential and things coming to completion','Home, family and inner peace while things gestate','30,18 56,50 30,82 4,50 30,18'],
 ['dagaz','Dagaz','D','Day','Dawn, breakthrough and awakening','Thresholds and doorways, keeping harm from entering','8,15 8,85 52,15 52,85 8,15'],
 ['othala','Othala','O','Estate','Heritage, homeland and inheritance','Home, land, family and what your ancestors left you','6,100 54,38 30,8 6,38 54,100']
].map(([id,n,s,lit,m,p,g])=>({id,n,s,lit,m,p,g:g.split('|')}));
const NQ=12,ND=8;   /* questions per quiz, runes per drawing round */

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s),M=$('#main');
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=iso(new Date());
const lc=s=>s[0].toLowerCase()+s.slice(1);
const star='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0C10.8 6.6 13.4 9.2 20 10C13.4 10.8 10.8 13.4 10 20C9.2 13.4 6.6 10.8 0 10C6.6 9.2 9.2 6.6 10 0Z" fill="currentColor"/></svg>';
const lines=x=>x.g.map(p=>`<polyline points="${p}"/>`).join('');
const glyph=(x,h)=>`<svg class="gl" viewBox="-12 -10 84 120" width="${Math.round(h*.7)}" height="${h}" aria-hidden="true">${lines(x)}</svg>`;
/* Seeded shuffle: the seed is today's date, so every day deals a different order. */
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const rng=seed=>{let a=hash(seed);return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const shuf=(a,r)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ================= progress (kept in this browser) ================= */
const KEY='wym-runes-v1';
let st={streak:0,last:'',stats:{},done:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{}
st.stats=st.stats||{};st.done=st.done||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch{}};
if(st.last!==today){const y=new Date();y.setDate(y.getDate()-1);st.streak=st.last===iso(y)?(st.streak||0)+1:1;st.last=today;st.done={};save()}
const sc=id=>{const s=st.stats[id];return s?Math.max(-3,Math.min(4,s.r-s.w)):0};
const level=id=>!st.stats[id]?'New':sc(id)>=3?'Known':'Learning';
const mark=(id,ok)=>{const s=st.stats[id]=st.stats[id]||{r:0,w:0};ok?s.r++:s.w++;save()};
/* Today's deal for a mode: shuffled by date, weakest runes first, then shuffled again. */
const rounds={cards:0,quiz:0,draw:0};
const pick=(mode,n)=>{const r=rng(today+mode+rounds[mode]++);return {r,list:shuf(shuf(R,r).sort((a,b)=>sc(a.id)-sc(b.id)).slice(0,n),r)}};

/* ================= shared pieces ================= */
let acts={},view='home';
const ses={cards:null,quiz:null,draw:null};
const bar=(lab,count,f)=>`<div class="bar"><span class="lab">${lab}</span><span class="count">${count}</span></div><div class="prog"><i style="width:${Math.round(f*100)}%"></i></div>`;
const row=(x,tag)=>{const l=level(x.id);return `<article class="row">${glyph(x,72)}<div><h3>${x.n}${tag?`<span class="tag ${l==='Known'?'on':l==='New'?'off':''}">${l}</span>`:''}</h3><span class="lab">${x.s} · ${x.lit}</span><p>${x.m}.</p><p class="muted">Protects ${lc(x.p)}.</p></div></article>`};
const result=(lab,big,txt,mode,again,extra='')=>`<div class="result"><div class="stars">${star.repeat(3)}</div><span class="lab">${lab}</span><div class="n">${big}</div><p class="muted">${txt}</p></div>${extra}<div class="two"><button class="btn ghost" data-go="home">Back to today</button><button class="btn" data-go="${mode}">${again}</button></div>`;

/* ================= today ================= */
function home(){const d=new Date(),rod=R[Math.floor(rng(today+'rod')()*R.length)],known=R.filter(x=>level(x.id)==='Known').length,dn=st.done;
  const mode=(v,lab,h,p,s,on)=>`<button class="mode" data-go="${v}"><div><span class="lab">${lab}</span><h3>${h}</h3><p>${p}</p></div><span class="tag ${on?'on':'off'}">${s}</span></button>`;
  M.innerHTML=`<div class="hero"><div class="stars">${star.repeat(5)}</div><h1>${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</h1></div>
   <section class="rod"><span class="lab">Rune of the day</span><div class="rodin">${glyph(rod,120)}<div><h2>${rod.n}</h2><span class="sub">${rod.s} · ${rod.lit}</span><p>${rod.m}.</p><p class="muted">Protects ${lc(rod.p)}.</p></div></div></section>
   <span class="lab sec">Today's practice</span>
   <div class="modes">${mode('cards','Recall','Flashcards','Turn each card and recall its name, meaning and protection.',dn.cards?'Done':R.length+' cards',dn.cards)}
     ${mode('quiz','Test','Multiple choice','A fresh set of questions, reshuffled every day.',dn.quiz!=null?`Best ${dn.quiz}/${NQ}`:NQ+' questions',dn.quiz!=null)}
     ${mode('draw','Write','Draw the rune','Read the name and meaning, then draw it from memory.',dn.draw!=null?`Best ${dn.draw}/${ND}`:ND+' runes',dn.draw!=null)}</div>
   <div class="facts"><div><b>${st.streak}</b><span class="lab">Day streak</span></div><div><b>${known}/${R.length}</b><span class="lab">Runes known</span></div></div>`}

/* ================= flashcards ================= */
function cards(){
  if(!ses.cards){const {r,list}=pick('cards',R.length);ses.cards={q:list.map(x=>({x,f:r()<.6})),n:list.length,known:0,flip:false}}
  const s=ses.cards;
  if(!s.q.length){ses.cards=null;st.done.cards=1;save();M.innerHTML=result('Flashcards',`${s.n}/${s.n}`,'Every card turned and known for today.','cards','Shuffle again');return}
  const c=s.q[0],x=c.x;
  M.innerHTML=`${bar('Flashcards',`${s.known} of ${s.n} known`,s.known/s.n)}
   <button class="card ${s.flip?'back':''}" data-a="flip" aria-label="Turn the card over">${s.flip
     ?`${glyph(x,92)}<h2>${x.n}</h2><span class="sub">${x.s} · ${x.lit}</span><span class="lab">Meaning</span><p>${x.m}.</p><span class="lab">Protects</span><p>${x.p}.</p>`
     :c.f?`${glyph(x,190)}<span class="lab">Name it, its meaning and what it protects</span>`:`<span class="lab">Picture this rune and its meaning</span><h2>${x.n}</h2>`}</button>
   ${s.flip?`<div class="two"><button class="btn ghost" data-a="no">Still learning</button><button class="btn" data-a="yes">Know it</button></div>`:`<p class="hint">Tap the card to turn it over.</p>`}`;
  acts={flip(){s.flip=!s.flip;cards()},
    no(){mark(x.id,false);s.q.push(s.q.shift());s.flip=false;cards()},
    yes(){mark(x.id,true);s.q.shift();s.known++;s.flip=false;cards()}}}

/* ================= multiple choice ================= */
const QT=[
  {q:'Which rune is this?',show:x=>glyph(x,120),opt:x=>x.n},
  {q:'What does this rune mean?',show:x=>glyph(x,120),opt:x=>x.m},
  {q:'What does this rune protect?',show:x=>glyph(x,120),opt:x=>x.p},
  {q:'Find this rune',show:x=>`<h2>${x.n}</h2>`,opt:x=>glyph(x,66),g:1},
  {q:'Which rune carries this meaning?',show:x=>`<p class="big">${x.m}</p>`,opt:x=>glyph(x,66),g:1},
  {q:'Which rune protects this?',show:x=>`<p class="big">${x.p}</p>`,opt:x=>x.n}
];
function quiz(){
  if(!ses.quiz){const {r,list}=pick('quiz',NQ);ses.quiz={i:0,right:0,ans:null,miss:[],qs:list.map(x=>({x,t:QT[Math.floor(r()*QT.length)],o:shuf([x,...shuf(R.filter(y=>y!==x),r).slice(0,3)],r)}))}}
  const s=ses.quiz,n=s.qs.length;
  if(s.i>=n){ses.quiz=null;st.done.quiz=Math.max(st.done.quiz??0,s.right);save();
    M.innerHTML=result('Quiz result',`${s.right}/${n}`,s.right===n?'A perfect round.':'The runes below will come up again sooner.','quiz','Play again',
      s.miss.length?`<span class="lab sec">To revisit</span><div class="rows">${s.miss.map(x=>row(x)).join('')}</div>`:'');return}
  const q=s.qs[s.i],x=q.x,a=s.ans,ok=a!=null&&q.o[a]===x;
  M.innerHTML=`${bar('Quiz',`Question ${s.i+1} of ${n}`,s.i/n)}
   <div class="ask"><span class="lab">${q.t.q}</span>${q.t.show(x)}</div>
   <div class="opts ${q.t.g?'g':''}">${q.o.map((o,i)=>`<button class="opt ${a!=null?(o===x?'ok':i===a?'bad':''):''}" data-a="ans" data-i="${i}" ${a!=null?'disabled':''}>${q.t.opt(o)}</button>`).join('')}</div>
   ${a!=null?`<div class="fb" role="status">${glyph(x,66)}<div><span class="lab ${ok?'':'bad'}">${ok?'Correct':'Not quite. The answer is'}</span><h3>${x.n}</h3><p>${x.m}.</p><p class="muted">Protects ${lc(x.p)}.</p></div></div>
     <button class="btn wide" data-a="next">${s.i+1<n?'Next question':'See result'}</button>`:''}`;
  acts={ans(b){if(s.ans!=null)return;s.ans=+b.dataset.i;const good=q.o[s.ans]===x;mark(x.id,good);good?s.right++:s.miss.includes(x)||s.miss.push(x);quiz()},
    next(){s.i++;s.ans=null;quiz();scrollTo(0,0)}}}

/* ================= draw the rune ================= */
function draw(){
  if(!ses.draw)ses.draw={list:pick('draw',ND).list,i:0,right:0,rev:false,strokes:[]};
  const s=ses.draw,n=s.list.length;
  if(s.i>=n){ses.draw=null;st.done.draw=Math.max(st.done.draw??0,s.right);save();
    M.innerHTML=result('Drawing round',`${s.right}/${n}`,s.right===n?'Every rune drawn from memory.':'The ones you missed will come up again sooner.','draw','Draw again');return}
  const x=s.list[s.i];
  M.innerHTML=`${bar('Draw',`Rune ${s.i+1} of ${n}`,s.i/n)}
   <div class="ask"><span class="lab">Draw this rune from memory</span><h2>${x.n}</h2><p class="sub">${x.m}</p></div>
   <div class="pad"><canvas id="cv" width="600" height="600" aria-label="Drawing area"></canvas>${s.rev?`<svg class="gl over" viewBox="-30 -10 120 120" aria-hidden="true">${lines(x)}</svg>`:''}</div>
   ${s.rev?`<p class="hint">The true shape is laid over yours in gold. How did you do?</p><div class="two"><button class="btn ghost" data-a="no">Missed it</button><button class="btn" data-a="yes">Got it</button></div>`
     :`<div class="three"><button class="btn ghost" data-a="undo">Undo</button><button class="btn ghost" data-a="clear">Clear</button><button class="btn" data-a="rev">Reveal</button></div>`}`;
  const cv=$('#cv'),ctx=cv.getContext('2d'),ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1d2440';let live=null;
  const paint=()=>{ctx.clearRect(0,0,600,600);ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=22;ctx.strokeStyle=ctx.fillStyle=ink;
    for(const q of live?[...s.strokes,live]:s.strokes){ctx.beginPath();
      if(q.length===1){ctx.arc(q[0][0],q[0][1],11,0,7);ctx.fill();continue}
      ctx.moveTo(q[0][0],q[0][1]);for(let i=1;i<q.length;i++)ctx.lineTo(q[i][0],q[i][1]);ctx.stroke()}};
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
  if(!s.rev){
    cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch{}live=[pos(e)];paint()};
    cv.onpointermove=e=>{if(live){live.push(pos(e));paint()}};
    cv.onpointerup=cv.onpointercancel=()=>{if(live){s.strokes.push(live);live=null;paint()}}}
  paint();
  const nx=ok=>{mark(x.id,ok);ok&&s.right++;s.i++;s.rev=false;s.strokes=[];draw();scrollTo(0,0)};
  acts={undo(){s.strokes.pop();paint()},clear(){s.strokes=[];paint()},rev(){s.rev=true;draw()},yes(){nx(true)},no(){nx(false)}}}

/* ================= rune index ================= */
function lib(){const known=R.filter(x=>level(x.id)==='Known').length;
  M.innerHTML=`<div class="head"><span class="lab">Elder Futhark</span><h1>Rune index</h1><p class="muted">${R.length} runes · ${known} known</p></div>
   <div class="rows">${R.map(x=>row(x,true)).join('')}</div>
   <p class="foot"><button class="link warn" data-a="reset">Reset my progress</button></p>`;
  acts={reset(b){if(b.dataset.sure){st.stats={};st.done={};save();lib()}else{b.dataset.sure=1;b.textContent='Confirm reset'}}}}

/* ================= navigation ================= */
const V={home,cards,quiz,draw,lib};
function go(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===v)));acts={};V[v]();scrollTo(0,0)}
$('#nav').onclick=e=>{const b=e.target.closest('button');b&&go(b.dataset.v)};
M.onclick=e=>{const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);const b=e.target.closest('[data-a]');b&&acts[b.dataset.a]?.(b)};
/* A new day deals a new shuffle, even if the app was left open overnight. */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&iso(new Date())!==today)location.reload()});
go('home');
</script>
</body>
</html>
